name: Build unsigned Windows setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run safe tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $outputPath = Join-Path $env:RUNNER_TEMP 'soundflow-test-output.txt'
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1 *>&1 | Tee-Object -FilePath $outputPath | Out-String
          $testExitCode = $LASTEXITCODE
          Write-Host $output
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
      - name: Publish Windows test diagnostics
        if: failure()
        shell: powershell
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP 'soundflow-test-output.txt'
          if (Test-Path -LiteralPath $outputPath) {
            $tail = (Get-Content -LiteralPath $outputPath | Select-Object -Last 30) -join "`n"
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error file=tests/run.ps1,title=Windows test failure::$annotation"
          }
      - name: Locate Inno Setup
        shell: powershell
        env:
          SOUNDFLOW_LARK_WEBHOOK: ${{ secrets.SOUNDFLOW_LARK_WEBHOOK }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is unavailable.' }
          .\installer\build.ps1 -InnoSetupCompiler $compiler -RequireLarkWebhook
      - name: Upload unsigned artifact for signing review
        uses: actions/upload-artifact@v4
        with:
          name: soundflow-windows-unsigned
          path: |
            installer/output/SoundFlowDesktop-Setup.exe
            installer/output/SoundFlowDesktop-Setup.exe.sha256
          if-no-files-found: error
