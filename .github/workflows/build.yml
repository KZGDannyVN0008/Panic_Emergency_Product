name: Build unsigned Windows setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run safe tests
        shell: powershell
        run: |
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1 *>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $annotation = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows test failure::$annotation"
            exit $LASTEXITCODE
          }
      - name: Locate Inno Setup
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is unavailable.' }
          .\installer\build.ps1 -InnoSetupCompiler $compiler
      - name: Upload unsigned artifact for signing review
        uses: actions/upload-artifact@v4
        with:
          name: soundflow-windows-unsigned
          path: |
            installer/output/SoundFlowDesktop-Setup.exe
            installer/output/SoundFlowDesktop-Setup.exe.sha256
          if-no-files-found: error
