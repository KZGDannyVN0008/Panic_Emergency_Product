name: Windows validation

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run safe test suite
        shell: powershell
        run: |
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1 *>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $annotation = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows test failure::$annotation"
            exit $LASTEXITCODE
          }
